# dsh-video-bg bundle patch: inserts the plugin into the profile roster.
#
# The row is a bare plugin by package name. The package root (`exports["."]`)
# is the host half: it serves the local video over `/video-bg/media` with HTTP
# Range support. `dsh.client` in package.json serves the browser half from
# `exports["./client"]` through the DSH client-module route.
#
# Users configure it from their own profile patch (`cordis.patch.yml`):
#
#   - id: ui-video-bg
#     config:
#       videoPath: 'D:\my-video.mp4'
- insert:
    - id: ui-video-bg
      name: dsh-video-bg
